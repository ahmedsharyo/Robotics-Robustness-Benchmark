[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-robustness-benchmark"
version = "0.1.0"
description = "Reproducible MuJoCo benchmark for robot reaching under model mismatch"
requires-python = ">=3.11"
dependencies = ["mujoco>=3.1", "gymnasium>=0.29", "torch>=2.2", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
